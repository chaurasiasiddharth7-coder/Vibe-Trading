name: Desk checks

# Runs on every PR into the desk branches (and pushes to them), so nobody has to run tests by hand.
# Python 3.11 = the server image; 3.14 = the Mac that runs the paper guard.
on:
  pull_request:
    branches: ["alphadesk/**"]
  push:
    branches: ["alphadesk/**", "overhaul/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desk-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install
        run: pip install -r agent/requirements.txt pytest
      - name: Profit Guard, desk pages, users, Strategies, audit fixes, BTST, intraday, auth
        working-directory: agent
        run: >
          python -m pytest -q -p no:cacheprovider -W ignore
          tests/profit_guard
          tests/test_strategies.py tests/test_audit_fixes.py tests/test_review_fixes.py
          tests/test_desk_users.py tests/test_wealth_pages.py tests/test_desk_profiles.py
          tests/test_auth_precedence.py tests/test_security_auth_api.py tests/test_api_infrastructure.py
          tests/test_alphadesk_board_paper.py tests/test_btst.py tests/test_intraday_days.py
          tests/test_runtime_scheduler.py tests/test_sse_ticket_and_headers.py tests/test_spa_deep_link.py tests/test_nse_daily.py tests/test_fast_forecast.py tests/test_live_quotes_watchlist.py tests/test_market_brief.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npx vitest run
      - name: Hosted build (what Vercel runs)
        working-directory: frontend
        env:
          VITE_DASHBOARD_ONLY: "1"
        run: npm run build
